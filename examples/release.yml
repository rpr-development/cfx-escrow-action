# .github/workflows/release.yml
#
# Drop-and-place workflow for a standard FiveM resource.
# Requirements:
#   - fxmanifest.lua is in the root of the repo
#   - Secret CFX_PASSKEY_CREDENTIAL is set (see setup-passkey in the action repo)
#   - Variable CFX_ASSET_ID is created automatically after the first run
#
# Optional:
#   - Secret GITHUB_PAT (PAT with actions:write scope) for automatically saving CFX_ASSET_ID
#
# Trigger: create a GitHub Release (draft or pre-release supported).
# - version      → release tag (e.g. v1.2.3 → 1.2.3)
# - changelog    → release body (description)
# - release_candidate → true when the release is marked as pre-release

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write  # Create GitHub Release
  actions: write   # Save CFX_ASSET_ID variable

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to Cfx.re Portal
        uses: rpr-development/cfx-escrow-action@v1
        with:
          resource_dir: ${{ github.workspace }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cfx_passkey_credential: ${{ secrets.CFX_PASSKEY_CREDENTIAL }}
          cfx_asset_id: ${{ vars.CFX_ASSET_ID }}
          github_pat: ${{ secrets.GITHUB_PAT }}
          # version, changelog and release_candidate are filled in automatically
          # from the GitHub Release — no need to pass them here.
