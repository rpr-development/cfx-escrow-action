# .github/workflows/release.yml
#
# Drop-and-place workflow for a standard FiveM resource.
# Requirements:
#   - fxmanifest.lua is in the root of the repo
#   - Secret CFX_PASSKEY_CREDENTIAL is set (see setup-passkey in the action repo)
#   - Variable CFX_ASSET_ID is created automatically after the first run
#
# Optional:
#   - Secret GH_PAT (fine-grained PAT: Secrets + Variables read/write) for session
#     persistence and automatically saving CFX_ASSET_ID
#
# Triggers:
#   push          → deploys automatically, changelog from git commits
#   release       → version/changelog/release_candidate from the GitHub Release
#   workflow_dispatch → manual run with optional custom changelog

name: Release

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog / release notes (leave empty to use git commits)'
        required: false
        default: ''
      version:
        description: 'Version override (leave empty to read from fxmanifest.lua)'
        required: false
        default: ''
      release_candidate:
        description: 'Mark as Release Candidate / Beta'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# One run per branch/tag at a time.
# For push: cancels the previous run when a new push arrives.
# For release: a release tag is unique, so no cancellation occurs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Create GitHub Release
  actions: write   # Save CFX_ASSET_ID variable

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload to Cfx.re Portal
        uses: rpr-development/cfx-escrow-action@v1
        with:
          resource_dir: ${{ github.workspace }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cfx_passkey_credential: ${{ secrets.CFX_PASSKEY_CREDENTIAL }}
          cfx_asset_id: ${{ vars.CFX_ASSET_ID }}
          github_pat: ${{ secrets.GH_PAT }}
          # Session persistence + automatic new-device/location recovery (see action README)
          cfx_session_cookie: ${{ secrets.CFX_SESSION_COOKIE }}
          cfx_totp_secret: ${{ secrets.CFX_TOTP_SECRET }}
          cfx_imap_credentials: ${{ secrets.CFX_IMAP_CREDENTIALS }}
          # workflow_dispatch: use the manually entered values
          # release: filled in automatically from the GitHub Release
          # push: version from fxmanifest.lua, changelog from git commits
          changelog: ${{ inputs.changelog }}
          version: ${{ inputs.version }}
          release_candidate: ${{ inputs.release_candidate }}
