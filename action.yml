name: 'Cfx.re Escrow Upload'
description: 'Uploads a FiveM resource to the Cfx.re Portal for escrow, then attaches the escrowed zip to a GitHub Release.'

inputs:
  mode:
    description: "'deploy' (default) builds, uploads and releases; 'keepalive' only refreshes and persists the forum session — meant for a scheduled workflow"
    required: false
    default: 'deploy'
  resource_dir:
    description: 'Absolute path to the resource directory (e.g. github.workspace/dist) — required for mode: deploy'
    required: false
    default: ''
  repo_name:
    description: 'Asset name on the Cfx.re Portal (defaults to the repository name)'
    required: false
    default: ''
  cfx_passkey_credential:
    description: 'Contents of passkey-credential.json (secret CFX_PASSKEY_CREDENTIAL). Optional when relying on a persisted session, but needed as fallback login and as trigger for the automatic new-device recovery.'
    required: false
    default: ''
  cfx_asset_id:
    description: 'Known Cfx.re Portal asset ID — auto-discovered if empty'
    required: false
    default: ''
  cfx_email_login_url:
    description: 'One-time "Log in via link" URL from the Cfx forum email, used when the forum blocks login from a new device/location. Also read from repository variable CFX_EMAIL_LOGIN_URL if empty.'
    required: false
    default: ''
  cfx_totp_secret:
    description: 'Base32 TOTP secret of the account''s authenticator — required to complete the email login link when 2FA is enabled (secret CFX_TOTP_SECRET)'
    required: false
    default: ''
  cfx_session_cookie:
    description: 'Persisted forum session cookie from a previous run (secret CFX_SESSION_COOKIE) — skips login entirely; saved back automatically when github_pat is provided'
    required: false
    default: ''
  cfx_imap_credentials:
    description: 'JSON {"host","user","password","port","waitMinutes"} for a mailbox receiving the "Log in via link" mail — the account''s own inbox or a dedicated (auto-)forward address (secret CFX_IMAP_CREDENTIALS). Enables automatic recovery from the new-device/location block; the run polls the mailbox for waitMinutes (default 3).'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for creating releases (secrets.GITHUB_TOKEN)'
    required: true
  github_pat:
    description: 'GitHub PAT for saving the CFX_ASSET_ID variable and the CFX_SESSION_COOKIE secret (optional, requires repo + actions:write scope)'
    required: false
    default: ''
  version:
    description: 'Version string sent to the Cfx.re Portal (defaults to the release tag, then fxmanifest.lua, then the short commit SHA)'
    required: false
    default: ${{ github.event.release.tag_name }}
  changelog:
    description: 'Release notes / changelog text sent to the Cfx.re Portal (defaults to the release body)'
    required: false
    default: ${{ github.event.release.body || 'Automated release' }}
  release_candidate:
    description: 'Mark this upload as a Release Candidate / Beta instead of a Full Release (defaults to the pre-release flag of the GitHub Release)'
    required: false
    default: ${{ github.event.release.prerelease || 'false' }}

runs:
  using: 'composite'
  steps:
    - name: Puppeteer system dependencies
      shell: bash
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q \
          libgbm-dev libnss3 libatk-bridge2.0-0 libdrm2 \
          libxkbcommon0 libgtk-3-0 libasound2t64

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install

    - name: Restore portal credentials
      shell: bash
      env:
        CFX_PASSKEY: ${{ inputs.cfx_passkey_credential }}
      run: |
        printf '%s' "$CFX_PASSKEY" > "${{ github.action_path }}/passkey-credential.json"

    - name: ${{ inputs.mode == 'keepalive' && 'Refresh forum session' || 'Deploy to portal + create release' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        RESOURCE_DIR:             ${{ inputs.resource_dir }}
        REPO_NAME:                ${{ inputs.repo_name || github.event.repository.name }}
        GITHUB_TOKEN:             ${{ inputs.github_token }}
        GITHUB_PAT:               ${{ inputs.github_pat }}
        GITHUB_REPOSITORY:        ${{ github.repository }}
        GITHUB_SHA:               ${{ github.sha }}
        CFX_ASSET_ID:             ${{ inputs.cfx_asset_id }}
        CFX_EMAIL_LOGIN_URL:      ${{ inputs.cfx_email_login_url }}
        CFX_TOTP_SECRET:          ${{ inputs.cfx_totp_secret }}
        CFX_SESSION_COOKIE:       ${{ inputs.cfx_session_cookie }}
        CFX_IMAP_CREDENTIALS:     ${{ inputs.cfx_imap_credentials }}
        CFX_VERSION:              ${{ inputs.version }}
        CFX_CHANGELOG:            ${{ inputs.changelog }}
        CFX_RELEASE_CANDIDATE:    ${{ inputs.release_candidate }}
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      run: bun run ${{ inputs.mode == 'keepalive' && 'keep-alive.ts' || 'cfx-deploy.ts' }}

    - name: Clean up credentials
      if: always()
      shell: bash
      run: rm -f "${{ github.action_path }}/passkey-credential.json"

