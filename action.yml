name: 'Cfx.re Escrow Upload'
description: 'Uploads a FiveM resource to the Cfx.re Portal for escrow, then attaches the escrowed zip to a GitHub Release.'

inputs:
  resource_dir:
    description: 'Absolute path to the resource directory (e.g. github.workspace/dist)'
    required: true
  repo_name:
    description: 'Asset name on the Cfx.re Portal (defaults to the repository name)'
    required: false
    default: ''
  cfx_passkey_credential:
    description: 'Contents of passkey-credential.json (secret CFX_PASSKEY_CREDENTIAL)'
    required: true
  cfx_auth_state:
    description: 'Contents of auth-state.json (secret CFX_AUTH_STATE)'
    required: true
  cfx_asset_id:
    description: 'Known Cfx.re Portal asset ID — auto-discovered if empty'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for creating releases (secrets.GITHUB_TOKEN)'
    required: true
  github_pat:
    description: 'GitHub PAT for saving CFX_ASSET_ID variable and rotating auth-state (optional, requires actions:write scope)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Puppeteer system dependencies
      shell: bash
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q \
          libgbm-dev libnss3 libatk-bridge2.0-0 libdrm2 \
          libxkbcommon0 libgtk-3-0 libasound2t64

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install

    - name: Restore portal credentials
      shell: bash
      env:
        CFX_PASSKEY: ${{ inputs.cfx_passkey_credential }}
        CFX_AUTH: ${{ inputs.cfx_auth_state }}
      run: |
        printf '%s' "$CFX_PASSKEY" > "${{ github.action_path }}/passkey-credential.json"
        printf '%s' "$CFX_AUTH"    > "${{ github.action_path }}/auth-state.json"

    - name: Deploy to portal + create release
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        RESOURCE_DIR:      ${{ inputs.resource_dir }}
        REPO_NAME:         ${{ inputs.repo_name || github.event.repository.name }}
        GITHUB_TOKEN:      ${{ inputs.github_token }}
        GITHUB_PAT:        ${{ inputs.github_pat }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA:        ${{ github.sha }}
        CFX_ASSET_ID:      ${{ inputs.cfx_asset_id }}
      run: bun run cfx-deploy.ts

    - name: Rotate auth state (optional)
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_pat }}
      run: |
        if [ -f "${{ github.action_path }}/auth-state.json" ] && [ -n "${GH_TOKEN:-}" ]; then
          gh secret set CFX_AUTH_STATE \
            --body "$(cat "${{ github.action_path }}/auth-state.json")" \
            --repo "${{ github.repository }}"
          echo "Auth state rotated."
        else
          echo "No github_pat provided — skipping auth state rotation."
        fi
